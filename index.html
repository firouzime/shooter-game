<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain and Snow Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="intro" style="display: none;">
            <h2>Welcome to Rain and Snow Shooter!</h2>
            <p>Click or tap on raindrops and snowflakes to destroy them.</p>
            <p>Hit enough targets to advance through stages.</p>
            <button onclick="startGame()">Start Game</button>
        </div>
        <canvas id="gameCanvas" style="display: none;"></canvas>
        <div id="info" style="display: none;">
            <div id="score">Score: 0</div>
            <div id="stage">Stage: 1</div>
            <div id="timer">Time: 30</div>
            <div id="correct-hits">Correct Hits: 0</div>
            <div id="combo">Combo: 0</div>
            <div id="message"></div>
            <div id="stage-cleared" style="display: none;">
                <h2 id="stage-cleared-message"></h2>
                <button onclick="nextStage()">Next Stage</button>
            </div>
            <div id="game-over" style="display: none;">
                <h2 id="game-over-message"></h2>
                <button onclick="restartGame()">Restart</button>
                <button onclick="exitGame()">Exit</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
